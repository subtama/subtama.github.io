<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | {{site_name}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{base_url}}/articles/{{slug}}.html">
<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{base_url}}/articles/{{slug}}.html">
<meta name="theme-color" content="#6d5efc">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{title}}",
  "description": "{{description}}",
  "datePublished": "{{date}}",
  "dateModified": "{{updated}}",
  "author": {"@type": "Organization", "name": "{{site_name}}"},
  "publisher": {"@type": "Organization", "name": "{{site_name}}"}
}
</script>
</head>
<body>
<header class="site">
  <div class="wrap">
    <a class="brand" href="../index.html">サブ<em>たま</em></a>
    <nav><a href="../index.html">記事一覧</a></nav>
  </div>
</header>
<main>
  <div class="wrap read">
    <article>
      <div class="meta"><span class="tag">{{category}}</span><span>更新: {{updated}}</span><span>編集部が比較</span></div>
      <h1>{{title}}</h1>
      <div class="disclosure">※本記事はプロモーション（アフィリエイト広告）を含みます。掲載順は編集部の評価によるもので、料金・内容は各公式サイトの情報をご確認ください。</div>
      {{content}}
    </article>
  </div>
</main>
<footer class="site">
  <div class="wrap">
    <span class="fbrand">🍮 {{site_name}}</span>
    <span><a href="../index.html">記事一覧にもどる</a></span>
    <span class="fnote">※当サイトはアフィリエイト広告を含みます。料金・内容は各公式サイトの最新情報をご確認ください。</span>
    <span>&copy; {{year}} {{site_name}}</span>
  </div>
</footer>
</body>
</html>
